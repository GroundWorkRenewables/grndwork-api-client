version: 2.1

orbs:
  node: circleci/node@7
  python: circleci/python@3

jobs:
  test-node:
    parameters:
      node-version:
        type: string

    docker:
      - image: cimg/node:<< parameters.node-version >>

    steps:
      - checkout

      - node/install-packages:
          pkg-manager: npm
          include-branch-in-cache-key: false
          override-ci-command: |
            npm install --engine-strict
            npm install --no-save jest-junit

      - run:
          name: Run tests
          command: |
            mkdir -p ./test-results/junit

            npx eslint ./
            npx jest --ci --runInBand --reporters=default --reporters=jest-junit
          environment:
            JEST_JUNIT_OUTPUT_DIR: ./test-results/junit/
            JEST_JUNIT_OUTPUT_NAME: jest-results.xml

      - store_test_results:
          path: ./test-results/

  test-python:
    parameters:
      python-version:
        type: string

    docker:
      - image: cimg/python:<< parameters.python-version >>

    steps:
      - checkout

      - python/install-packages:
          pkg-manager: pipenv
          include-branch-in-cache-key: false
          args: --dev --deploy --ignore-pipfile
          cache-version: v0

      - run:
          name: Run tests
          command: |
            pipenv run flake8
            pipenv run mypy src_py/grndwork_api_client
            pipenv run python3 -m pytest

      - store_test_results:
          path: ./test-results/

  build:
    docker:
      - image: cimg/python:3.10-node

    steps:
      - checkout

      - node/install-packages:
          pkg-manager: npm
          include-branch-in-cache-key: false

      - python/install-packages:
          pkg-manager: pipenv
          include-branch-in-cache-key: false
          args: --dev --deploy --ignore-pipfile

      - run:
          name: Run Build
          command: |
            npm run build

      - run:
          name: Publish tagged release
          command: |
            if [[ $CIRCLE_TAG =~ ^v[0-9].* ]]; then
              case $CIRCLE_TAG in
                *alpha*)
                  npm publish --access public --tag alpha
                  ;;
                *beta*)
                  npm publish --access public --tag beta
                  ;;
                *rc*)
                  npm publish --access public --tag next
                  ;;
                *)
                  npm publish --access public --tag latest
                  ;;
              esac
            fi

workflows:
  main:
    jobs:
      - test-node:
          matrix:
            parameters:
              node-version:
                - "20.19"
                - "22.21"
                - "24.11"
          filters:
            tags:
              only: /^v[0-9].*/

      - test-python:
          matrix:
            parameters:
              python-version:
                - "3.10"
                - "3.11"
                - "3.12"
                - "3.13"
                - "3.14"
          filters:
            tags:
              only: /^v[0-9].*/

      - build:
          requires:
            - test-node
            - test-python
          filters:
            tags:
              only: /^v[0-9].*/
